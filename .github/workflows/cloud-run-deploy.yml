name: Deploy Backend to Cloud Run

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove old creds
        run: rm -f gha-creds-*.json || true

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/477943577410/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: careview-backend-deployer@sigma-new-480301.iam.gserviceaccount.com

      - name: Set GCP Project
        run: gcloud config set project ${{ secrets.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE="${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.PROJECT_ID }}/careview-backend-production/${{ secrets.BACKEND_SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
      
      - name: Debug environment secrets
        run: |
          echo "PROJECT_ID=${{ secrets.PROJECT_ID }}"
          echo "REGION=${{ secrets.REGION }}"
          echo "SERVICE_NAME=${{ secrets.BACKEND_SERVICE_NAME }}"
          echo "SERVICE_ACCOUNT_EMAIL=${{ secrets.BACKEND_SERVICE_ACCOUNT_EMAIL }}"
      
      - name: Verify gcloud project config
        run: |
          gcloud config list
          gcloud projects describe ${{ secrets.PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.BACKEND_SERVICE_NAME }} \
            --image $IMAGE \
            --region ${{ secrets.REGION }} \
            --platform managed \
            --service-account ${{ secrets.BACKEND_SERVICE_ACCOUNT_EMAIL }} \
            --add-cloudsql-instances ${{ secrets.CLOUDSQL_INSTANCE }} \
            --set-env-vars "^,^POSTGRES_USER=${{ secrets.DB_USER }},POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }},POSTGRES_DB=${{ secrets.DB_NAME }},POSTGRES_HOST=/cloudsql/${{ secrets.CLOUDSQL_INSTANCE }},NODE_ENV=production,JWT_SECRET=${{ secrets.JWT_SECRET }},GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }},GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }},GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }},FRONTEND_BASE_URL=${{ secrets.FRONTEND_BASE_URL }},DEFAULT_ORGANIZATION_ID=${{ secrets.DEFAULT_ORGANIZATION_ID }},DEFAULT_CLINIC_ID=${{ secrets.DEFAULT_CLINIC_ID }},CAL_WEBHOOK_SECRET=${{ secrets.CAL_WEBHOOK_SECRET }},SMTP_HOST=${{ secrets.SMTP_HOST }},SMTP_PORT=${{ secrets.SMTP_PORT }},SMTP_SECURE=${{ secrets.SMTP_SECURE }},SMTP_USER=${{ secrets.SMTP_USER }},SMTP_PASS=${{ secrets.SMTP_PASS }}"